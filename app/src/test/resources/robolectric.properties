# Robolectric global configuration for unit tests.
#
# sdk: Robolectric emulates the manifest targetSdk (37) only on a Java 21
# sandbox; the project builds with Java 17. Pin the default to SDK 35, which is
# Java-17 compatible. Tests needing a specific API level use @Config(sdk=...).
#
# application: the merged manifest points at RethinkDnsApplication, whose
# onCreate() initializes the Go backend (gojni native library, unavailable on
# the JVM) and would terminate the test JVM on any background failure. Use a
# plain android.app.Application instead; tests that need Koin start their own.
sdk=35
application=android.app.Application
