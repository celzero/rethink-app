name: Build APK

on:
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab
  push:
    branches: [ "main", "wg-socks5-coexist" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Make gradlew executable
      run: chmod +x gradlew
    - name: Build debug APK (F-Droid flavor, no Google services needed)
      run: ./gradlew assembleFdroidFullDebug --warning-mode all
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: rethink-wg-socks5-debug-apk
        path: app/build/outputs/apk/**/*universal*.apk
        if-no-files-found: error
