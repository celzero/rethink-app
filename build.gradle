// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.4.10'
    repositories {
        google()
        // https://jfrog.com/blog/into-the-sunset-bintray-jcenter-gocenter-and-chartcenter/
        // jcenter() is no longer getting updates, instead using mavenCentral
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // rethink-tv: Compose Compiler plugin (bundled with Kotlin since 2.0).
        // Required by the `tv` flavor for Compose-for-TV UI; only applied in
        // app/build.gradle, so phone variants pay no runtime cost (they
        // simply contain no @Composable declarations to process).
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
        // add firebase plugins - will be conditionally applied in app/build.gradle
        // Firebase (google-services + crashlytics) is play-flavour only.
        // website and fdroid builds are considered de-googled w.r.t. Firebase.
        def taskNames = gradle.startParameter.taskNames.join(',').toLowerCase()
        def playBuild = taskNames.contains("play")
        def fdroidBuild = taskNames.contains("fdroid")

        // check for fdroidserver value is set in system env
        def fdroidBuildServer = System.getenv("fdroidserver")
        def isFdroidBuildServer = fdroidBuildServer != null && !fdroidBuildServer.isEmpty() && fdroidBuildServer != "null"
        // Firebase tooling applies only to play builds; everything else is de-googled
        def deGoogled = !playBuild || fdroidBuild || isFdroidBuildServer

        println("app-task names: '$taskNames'")
        println("app; deGoogled? $deGoogled (playBuild: $playBuild, fdroidBuild: $fdroidBuild, fdroidBuildServer: $isFdroidBuildServer)")

        if (!deGoogled) {
            classpath 'com.google.gms:google-services:4.5.0'
            classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.7'
        }
    }
}

plugins {
    id 'com.google.devtools.ksp' version '2.3.11' apply false
}

allprojects {
    // NOTE: dependency repositories are declared centrally in settings.gradle
    // (dependencyResolutionManagement) because RepositoriesMode.PREFER_SETTINGS
    // ignores project-level repositories. This includes the firestack repo
    // (jitpack / github packages) selected via `firestackRepo` in gradle.properties.
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}
